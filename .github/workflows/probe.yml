name: Probe ACP Agents

on:
  workflow_dispatch:
    inputs:
      agents:
        description: Comma-separated agent IDs to probe (empty = all)
        required: false
        default: ""

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Setup uv
        run: pip install uv

      - name: Install agent CLIs
        run: |
          npm install -g autohand-cli @earendil-works/pi-coding-agent cline

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run probe
        working-directory: packages/probe
        run: pnpm start
        env:
          ACP_DUMMY_AUTH: "1"
          ACP_VERBOSE: "0"
          ACP_AGENTS: ${{ inputs.agents }}

      - name: Run codegen
        working-directory: packages/data
        run: pnpm codegen

      - name: Check for changes
        id: changes
        run: |
          git add packages/data/dist-src packages/data/package.json
          if git diff --cached --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No changes detected, skipping PR."
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Create changeset
        if: steps.changes.outputs.changed == 'true'
        run: |
          mkdir -p .changeset
          cat > .changeset/data-update.md << 'EOF'
          ---
          "acp-agent-metadata": patch
          ---

          Update agent metadata snapshot
          EOF
          git add .changeset/data-update.md

      - name: Open PR
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HUSKY: "0"
        run: |
          BRANCH="data/update-$(date -u +%Y-%m-%d)-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git commit -m "chore: update agent metadata snapshot"
          git push origin "$BRANCH"
          gh pr create \
            --title "chore: update agent metadata snapshot ($(date -u +%Y-%m-%d))" \
            --body "Automated probe run. Review the dist-src/ diff for data changes. Includes a changeset for release." \
            --label "automated"
